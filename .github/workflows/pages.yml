name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure API endpoint
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          printf 'window.ALGORENA_API_URL = "%s";\n' "$API_BASE_URL" > frontend/config.js
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::Repository variable API_BASE_URL is empty. The static site will deploy, but API actions will not work until a public HTTPS backend URL is configured."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
